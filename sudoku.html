<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f4">
  <link rel="manifest" href="manifest.json">
  <title>數獨練習</title>
  <style>
    :root{color-scheme:light;--bg:#f6f6f4;--panel:#fff;--line:#d9d9d4;--strong:#6b6b64;--text:#111827;--muted:#667085;--accent:#16866f;--bad:#dc2626}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC",system-ui,sans-serif;display:grid;place-items:center;padding:14px}
    .app{width:min(980px,100%);display:grid;grid-template-columns:minmax(320px,590px) 210px;gap:14px;align-items:start}.panel,.side{background:white;border:1px solid rgba(17,24,39,.12);border-radius:8px;box-shadow:0 12px 34px rgba(15,23,42,.1)}
    .header{display:flex;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid rgba(17,24,39,.1)}h1{margin:0;font-size:1.55rem}.stats{display:grid;grid-template-columns:repeat(2,72px);gap:8px}.stat{background:#f1f1ee;border:1px solid rgba(17,24,39,.1);border-radius:6px;padding:8px;text-align:center}.stat span{display:block;color:var(--muted);font-size:.76rem}.stat strong{font-size:1.08rem}
    .wrap{padding:14px}.board{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,560px);aspect-ratio:1;margin:auto;border:2px solid var(--strong);background:var(--line);gap:1px;user-select:none}.cell{position:relative;display:grid;place-items:center;border:0;background:white;color:#1d4ed8;font:650 clamp(1.1rem,5vw,2rem)/1 "Segoe UI",system-ui,sans-serif;cursor:pointer;padding:0}.cell:nth-child(3n){border-right:2px solid var(--strong)}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--strong)}.given{color:#111827}.selected{box-shadow:inset 0 0 0 4px var(--accent);z-index:2}.bad{color:#b91c1c;background:#fff1f1}.locked-bad{box-shadow:inset 0 0 0 3px rgba(220,38,38,.55)}.notes{position:absolute;inset:7%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);color:#475467;font-size:clamp(.48rem,1.8vw,.82rem);font-weight:600;align-items:center;justify-items:center}
    .message{min-height:50px;margin:0 16px 14px;padding:10px 12px;border:1px solid rgba(17,24,39,.12);border-radius:6px;background:white;color:#374151;line-height:1.45}.message.bad{border-color:rgba(220,38,38,.28);background:#fff1f1;color:#991b1b}.message.warn{border-color:rgba(245,158,11,.34);background:#fffbeb;color:#92400e}
    .side{display:grid;gap:14px;padding:14px}.number-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{min-height:40px;border:1px solid rgba(17,24,39,.14);border-radius:6px;background:white;color:var(--text);font:inherit;cursor:pointer;touch-action:manipulation}button:hover{background:#f3f4f6}.num{min-height:48px;font-size:1.24rem;font-weight:800}.primary,.active{background:var(--accent);color:white}
    @media(max-width:850px){.app{grid-template-columns:1fr}.header{align-items:center}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="header"><h1>數獨練習</h1><div class="stats"><div class="stat"><span>錯誤</span><strong id="mistakes">0</strong></div><div class="stat"><span>空格</span><strong id="emptyCount">0</strong></div></div></div>
      <div class="wrap"><div class="board" id="board"></div></div>
      <p class="message" id="message">先從只剩一種可能的格子開始。</p>
    </section>
    <aside class="side">
      <div class="number-pad" id="numberPad"></div>
      <div class="actions"><button id="noteBtn" type="button">筆記模式</button><button id="eraseBtn" type="button">清除</button><button id="checkBtn" type="button">檢查</button><button id="hintBtn" type="button">提示</button></div>
      <div class="difficulty"><button class="difficulty-btn active" data-level="easy" type="button">簡單</button><button class="difficulty-btn" data-level="medium" type="button">中等</button><button class="difficulty-btn" data-level="hard" type="button">困難</button></div>
      <button class="primary" id="newBtn" type="button">新題目</button>
    </aside>
  </main>
  <script>
    const CLUES={easy:42,medium:34,hard:28},boardEl=document.querySelector("#board"),padEl=document.querySelector("#numberPad"),noteBtn=document.querySelector("#noteBtn"),messageEl=document.querySelector("#message"),mistakesEl=document.querySelector("#mistakes"),emptyCountEl=document.querySelector("#emptyCount");let difficulty="easy",puzzle="",solution="",values=[],givens=[],notes=[],selected=0,noteMode=false,mistakes=0;
    function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pattern(r,c){return(r*3+Math.floor(r/3)+c)%9}function groups(){return shuffle([0,1,2]).flatMap(g=>shuffle([0,1,2]).map(i=>g*3+i))}
    function generatePuzzle(clues){const d=shuffle(["1","2","3","4","5","6","7","8","9"]),rows=groups(),cols=groups(),sol=[];for(const r of rows)for(const c of cols)sol.push(d[pattern(r,c)]);const puz=[...sol],rm=shuffle([...Array(81).keys()]);for(let i=0;i<81-clues;i++)puz[rm[i]]="0";return{puzzle:puz.join(""),solution:sol.join("")}}
    function start(level=difficulty){difficulty=level;const g=generatePuzzle(CLUES[difficulty]);puzzle=g.puzzle;solution=g.solution;values=puzzle.split("").map(c=>c==="0"?"":c);givens=puzzle.split("").map(c=>c!=="0");notes=Array.from({length:81},()=>new Set);selected=values.findIndex(v=>!v);if(selected<0)selected=0;mistakes=0;noteMode=false;noteBtn.classList.remove("active");setMsg("先從只剩一種可能的格子開始。","");updateDiff();render()}
    function row(i){return Math.floor(i/9)}function col(i){return i%9}function box(i){return Math.floor(row(i)/3)*3+Math.floor(col(i)/3)}function peers(i){const s=new Set,r=row(i),c=col(i),br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let n=0;n<9;n++){s.add(r*9+n);s.add(n*9+c)}for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)s.add(rr*9+cc);s.delete(i);return[...s]}function conflict(i,v){return peers(i).some(p=>values[p]===v)}function complete(){return values.every((v,i)=>v===solution[i])}
    function render(){boardEl.innerHTML="";values.forEach((v,i)=>{const b=document.createElement("button");b.type="button";b.className="cell";if(givens[i])b.classList.add("given");if(i===selected)b.classList.add("selected");if(v&&conflict(i,v))b.classList.add("bad");if(v&&v!==solution[i])b.classList.add("locked-bad");if(v)b.textContent=v;else if(notes[i].size){const n=document.createElement("span");n.className="notes";for(let x=1;x<=9;x++){const s=document.createElement("span");s.textContent=notes[i].has(String(x))?x:"";n.appendChild(s)}b.appendChild(n)}b.onclick=()=>{selected=i;render()};boardEl.appendChild(b)});mistakesEl.textContent=mistakes;emptyCountEl.textContent=values.filter(v=>!v).length}
    function input(n){if(givens[selected])return;const d=String(n);if(noteMode){if(values[selected])return;notes[selected].has(d)?notes[selected].delete(d):notes[selected].add(d);render();return}values[selected]=d;notes[selected].clear();peers(selected).forEach(p=>notes[p].delete(d));if(d!==solution[selected]){mistakes++;setMsg("這格不太對。","bad")}else setMsg(complete()?"完成，這盤解開了。":"填得不錯，繼續推下一格。","");render()}
    function erase(){if(givens[selected])return;values[selected]="";notes[selected].clear();setMsg("已清除選取格。","warn");render()}function candidates(i){if(values[i])return[];const used=new Set(peers(i).map(p=>values[p]).filter(Boolean));return["1","2","3","4","5","6","7","8","9"].filter(d=>!used.has(d))}
    function hint(){const i=values.findIndex((v,idx)=>!v&&candidates(idx).length===1),t=i>=0?i:values.findIndex(v=>!v);if(t<0)return;selected=t;candidates(t).slice(0,4).forEach(c=>notes[t].add(c));setMsg(candidates(t).length===1?`這格只能是 ${candidates(t)[0]}。`:"已標出候選數。","warn");render()}function check(){const wrong=values.reduce((c,v,i)=>c+(v&&v!==solution[i]?1:0),0);setMsg(wrong?`目前有 ${wrong} 格填錯。`:complete()?"全部正確。":"目前填入的數字都正確。",wrong?"bad":"");render()}function setMsg(t,tone){messageEl.textContent=t;messageEl.className=`message${tone?` ${tone}`:""}`}function updateDiff(){document.querySelectorAll(".difficulty-btn").forEach(b=>b.classList.toggle("active",b.dataset.level===difficulty))}
    for(let n=1;n<=9;n++){const b=document.createElement("button");b.className="num";b.textContent=n;b.onclick=()=>input(n);padEl.appendChild(b)}noteBtn.onclick=()=>{noteMode=!noteMode;noteBtn.classList.toggle("active",noteMode)};document.querySelector("#eraseBtn").onclick=erase;document.querySelector("#checkBtn").onclick=check;document.querySelector("#hintBtn").onclick=hint;document.querySelector("#newBtn").onclick=()=>start();document.querySelectorAll(".difficulty-btn").forEach(b=>b.onclick=()=>start(b.dataset.level));start("easy");
    if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
  </script>
</body>
</html>
