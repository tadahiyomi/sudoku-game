<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>踩地雷</title>
  <style>
    :root{color-scheme:light;--bg:#f3f0e8;--panel:#fffdf8;--text:#26231f;--muted:#766f64;--line:#d0c7b8;--cell:#e4dccf;--open:#fffaf0;--accent:#2c8c76;--bad:#d94b43;--mark:#d28b1f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--bg);color:var(--text);font-family:"Segoe UI","Noto Sans TC",system-ui,sans-serif}.app{width:min(760px,100%)}.panel{background:var(--panel);border:1px solid rgba(38,35,31,.12);border-radius:8px;box-shadow:0 12px 34px rgba(38,35,31,.12);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid rgba(38,35,31,.1)}h1{margin:0;font-size:1.55rem}.stats{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));gap:8px;min-width:230px}.stat{min-height:44px;display:grid;place-items:center;padding:6px 8px;border-radius:6px;background:#eee8dc;text-align:center}.stat span{display:block;color:var(--muted);font-size:.72rem}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 14px;border-bottom:1px solid rgba(38,35,31,.1)}button{min-height:40px;border:1px solid rgba(38,35,31,.12);border-radius:6px;background:#f7f2e8;color:var(--text);font:inherit;cursor:pointer;touch-action:manipulation}.active,.primary{background:var(--accent);color:white}.wrap{padding:14px}.board{--size:8;display:grid;grid-template-columns:repeat(var(--size),1fr);width:min(100%,620px);aspect-ratio:1;margin:auto;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:6px;overflow:hidden;user-select:none}.cell{display:grid;place-items:center;border:0;border-radius:0;background:var(--cell);font-weight:800;font-size:clamp(1rem,4.8vw,1.55rem);padding:0}.closed{box-shadow:inset 0 -3px 0 rgba(38,35,31,.16),inset 0 2px 0 rgba(255,255,255,.62)}.open{background:var(--open);box-shadow:none;cursor:default}.flag{color:var(--mark)}.mine{color:var(--bad);background:#ffe5e1}.boom{color:white;background:var(--bad)}.n1{color:#2e6ecb}.n2{color:#2c8c50}.n3{color:#cc4e3d}.n4{color:#6248b0}.n5{color:#b55c2d}.n6{color:#188c8f}.message{min-height:46px;margin:0 14px 14px;padding:10px 12px;border:1px solid rgba(44,140,118,.18);border-radius:6px;background:#f1faf6;color:#276f5f;line-height:1.45}.message.bad{border-color:rgba(217,75,67,.24);background:#fff0ee;color:#9d2f29}@media(max-width:640px){body{padding:10px;align-items:start}.top{display:grid}.stats{grid-template-columns:repeat(3,1fr);min-width:0}.controls{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <main class="app"><section class="panel"><div class="top"><h1>踩地雷</h1><div class="stats"><div class="stat"><span>地雷</span><strong id="mineCount">8</strong></div><div class="stat"><span>旗子</span><strong id="flagCount">0</strong></div><div class="stat"><span>時間</span><strong id="timer">0</strong></div></div></div><div class="controls"><button class="difficulty active" data-size="8" data-mines="8">入門</button><button class="difficulty" data-size="9" data-mines="10">簡單</button><button class="difficulty" data-size="12" data-mines="24">中等</button><button class="difficulty" data-size="15" data-mines="45">困難</button><button id="flagMode">插旗</button><button class="primary" id="newGame">新遊戲</button></div><div class="wrap"><div class="board" id="board"></div></div><p class="message" id="message">點格子翻開。手機上可開啟插旗模式來標記地雷。</p></section></main>
  <script>
    const board=document.querySelector("#board"),mineCount=document.querySelector("#mineCount"),flagCount=document.querySelector("#flagCount"),timer=document.querySelector("#timer"),msg=document.querySelector("#message"),flagBtn=document.querySelector("#flagMode");let size=8,total=8,cells=[],first=true,over=false,flagMode=false,seconds=0,timerId=0;
    function game(){cells=Array.from({length:size*size},(_,i)=>({i,mine:false,open:false,flag:false,count:0}));first=true;over=false;flagMode=false;seconds=0;clearInterval(timerId);timerId=0;flagBtn.classList.remove("active");setMsg("點格子翻開。手機上可開啟插旗模式來標記地雷。","");render()}function startTimer(){if(timerId)return;timerId=setInterval(()=>{seconds++;timer.textContent=seconds},1000)}
    function near(i){const r=Math.floor(i/size),c=i%size,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<size&&nc>=0&&nc<size)a.push(nr*size+nc)}return a}function place(safe){const block=new Set([safe,...near(safe)]);let n=0;while(n<total){const i=Math.floor(Math.random()*cells.length);if(cells[i].mine||block.has(i))continue;cells[i].mine=true;n++}cells.forEach(c=>c.count=near(c.i).filter(j=>cells[j].mine).length)}
    function click(i){if(over)return;const c=cells[i];if(!c||c.open)return;if(flagMode)return flag(i);if(c.flag)return;if(first){place(i);first=false;startTimer()}if(c.mine){c.open=true;return end(false,i)}reveal(i);hasWon()?end(true):render()}function reveal(i){const q=[i];while(q.length){const x=q.shift(),c=cells[x];if(!c||c.open||c.flag)continue;c.open=true;if(c.count)continue;near(x).forEach(n=>{if(!cells[n].open&&!cells[n].mine)q.push(n)})}}function flag(i){if(over||first)return;const c=cells[i];if(!c||c.open)return;c.flag=!c.flag;render()}function hasWon(){return cells.every(c=>c.mine||c.open)}function end(win,boom=-1){over=true;clearInterval(timerId);cells.forEach(c=>{if(c.mine)c.open=true});setMsg(win?`過關，用了 ${seconds} 秒。`:"踩到了，換一盤再來。",win?"":"bad");render(boom)}
    function render(boom=-1){board.style.setProperty("--size",size);board.innerHTML="";mineCount.textContent=total;flagCount.textContent=cells.filter(c=>c.flag).length;timer.textContent=seconds;cells.forEach(c=>{const b=document.createElement("button");b.className=`cell ${c.open?"open":"closed"}`;if(c.open&&c.mine){b.classList.add(c.i===boom?"boom":"mine");b.textContent="✹"}else if(c.open&&c.count){b.classList.add(`n${c.count}`);b.textContent=c.count}else if(c.flag){b.classList.add("flag");b.textContent="⚑"}b.onclick=()=>click(c.i);b.oncontextmenu=e=>{e.preventDefault();if(!first)flag(c.i)};board.appendChild(b)})}function setMsg(t,tone){msg.textContent=t;msg.className=`message${tone?` ${tone}`:""}`}
    document.querySelectorAll(".difficulty").forEach(b=>b.onclick=()=>{size=+b.dataset.size;total=+b.dataset.mines;document.querySelectorAll(".difficulty").forEach(x=>x.classList.remove("active"));b.classList.add("active");game()});flagBtn.onclick=()=>{flagMode=!flagMode;flagBtn.classList.toggle("active",flagMode)};document.querySelector("#newGame").onclick=game;game();
  </script>
</body>
</html>
